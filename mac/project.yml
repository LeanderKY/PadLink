name: PadLink
options:
  bundleIdPrefix: app.padlink
  developmentLanguage: de
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  PadLink:
    type: application
    platform: macOS
    sources:
      - path: PadLink
        excludes:
          - Info.plist
          - PadLink.entitlements
    info:
      path: PadLink/Info.plist
      properties:
        CFBundleDisplayName: PadLink
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: de
        LSApplicationCategoryType: public.app-category.graphics-design
        NSLocalNetworkUsageDescription: PadLink sucht dein Zeichen-Pad im WLAN.
        NSBonjourServices:
          - _padlink._tcp
        NSScreenCaptureUsageDescription: PadLink zeigt deinen Bildschirm auf dem Pad.
    entitlements:
      path: PadLink/PadLink.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.padlink.mac
        SWIFT_OBJC_BRIDGING_HEADER: PadLink/Sources/PadLink-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
